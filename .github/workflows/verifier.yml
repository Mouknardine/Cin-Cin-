name: Vérifier

# Cinq vérifications, à chaque envoi, avant toute publication :
#
#   npm run typecheck        — les schémas et l'outil Planification du
#                              Studio se tiennent (TypeScript).
#   npm test                 — l'ordre du programme est le bon, et ses DEUX
#                              copies (Studio et site) disent la même chose.
#   npm run test:messageries — la newsletter, rejouée dans un navigateur :
#                              telle quelle, collée dans l'éditeur du
#                              nouvel Outlook, et comme la dessine Word
#                              sous l'Outlook classique. Les pastilles des
#                              séances s'y sont fondues un soir en un seul
#                              bloc ; ce fichier empêche que ça revienne.
#   php verifications/billetterie-conclusion.php — un billet payé part
#                              par e-mail une fois et une seule, même si
#                              le client ne revient pas sur le site.
#   php verifications/donnees-personnelles.php — les commandes (e-mail
#                              de l'acheteur, référence du billet) sont
#                              toujours créées dans le dossier privé de
#                              Sanity, jamais lisibles sans clé.
#
# Les deux vérifications PHP sont aussi rejouées par le déploiement
# Infomaniak, qui ne publie rien si elles échouent.
#
# L'ordre du programme existe forcément en deux exemplaires :
# sanity/salles.ts pour le Studio, assets/js/data.js pour le site, qui
# n'est fait que de HTML, de CSS et de JavaScript sans compilation et ne
# peut donc pas importer de TypeScript. C'est précisément parce qu'on ne
# peut pas les fusionner qu'on les compare ici à chaque fois : le
# cinéma a signalé un vendredi mal rangé, on ne veut pas qu'il ait à le
# signaler deux fois.
#
# Rien à régler : ce workflow n'a besoin d'aucun secret.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    # Ubuntu 24.04 et pas « ubuntu-latest » : le 18 novembre 2026, GitHub
    # est passé à Ubuntu 26.04, où Playwright 1.56 ne sait pas installer
    # son navigateur (« Playwright does not support chromium on
    # ubuntu26.04-x64 »), et la publication du Studio s'est arrêtée là.
    # À remonter quand Playwright prendra en charge la nouvelle version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Node 22 : verifications/ordre-des-seances.mjs lit directement
      # sanity/salles.ts, le fichier du Studio. Node sait retirer les
      # annotations TypeScript tout seul depuis cette version — c'est
      # ce qui permet de vérifier la vraie règle du Studio, et pas une
      # troisième copie écrite pour l'occasion.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Les schémas du Studio se tiennent
        run: npm run typecheck

      - name: L'ordre du programme est le bon
        run: npm test

      # La billetterie (dossier api/) est en PHP. PHP est déjà installé
      # sur la machine de GitHub : rien à ajouter.
      - name: La billetterie se lit sans erreur
        run: for f in api/*.php; do php -l "$f" || exit 1; done

      # Un billet payé part par e-mail une fois et une seule, même si
      # le client ne revient pas sur le site. Voir le fichier.
      - name: Le billet payé part par e-mail, une seule fois
        run: php verifications/billetterie-conclusion.php

      # Les commandes ne sont jamais lisibles sans clé. Voir le fichier.
      - name: Les données des acheteurs restent privées
        run: php verifications/donnees-personnelles.php

      - name: Le navigateur des vérifications
        run: npx playwright install --with-deps chromium

      - name: La newsletter tient dans les messageries
        run: npm run test:messageries
