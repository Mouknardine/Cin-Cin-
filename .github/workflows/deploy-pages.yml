name: Déploiement GitHub Pages

on:
  push:
    branches:
      - claude/zinema-cinema-redesign-ttcpaf
  workflow_dispatch:
  # Déclenché par le webhook Sanity à chaque publication de contenu, pour
  # que le site statique se reconstruise avec le contenu à jour (voir
  # SANITY.md, section « Reconstruction automatique »).
  repository_dispatch:
    types: [sanity-content-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (export statique)
        env:
          NEXT_PUBLIC_BASE_PATH: /Cin-Cin-
          # Ne renseigner que si un projet Sanity est déjà configuré dans
          # les "secrets" du dépôt (Settings > Secrets and variables >
          # Actions). Sans ça, le site utilise le contenu d'exemple.
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
