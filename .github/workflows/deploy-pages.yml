name: Déploiement GitHub Pages

# Le site est de simples fichiers HTML/CSS/JS : aucun build n'est
# nécessaire, ce workflow ne fait que publier le dossier tel quel. Un
# changement de contenu (Sanity) n'a pas besoin de ce workflow : il
# apparaît seul, sans redéploiement (voir SANITY.md).
# Publication mise en veille le 2026-09-08 : le site officiel est
# désormais servi par Infomaniak (voir deploy-infomaniak.yml).
# Laisser GitHub Pages publier en parallèle créerait une seconde
# adresse avec le même contenu, que Google indexerait comme un
# doublon — et on ne saurait plus laquelle fait foi.
#
# Le workflow reste disponible à la demande, pour obtenir un
# aperçu sans toucher au site en ligne : onglet Actions →
# « Déploiement GitHub Pages » → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Le dossier « api » (billetterie SumUp) n'est PAS publié ici :
      # GitHub Pages ne sait pas exécuter PHP, il en afficherait le
      # code source. La billetterie n'existe que sur l'hébergement
      # Infomaniak — voir BILLETTERIE.md.
      - name: Rassembler les fichiers du site (sans le Studio Sanity ni les scripts)
        run: |
          mkdir site
          cp -r index.html films film agenda evenements histoire membership contact billet assets site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
