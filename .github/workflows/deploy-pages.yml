name: Déploiement GitHub Pages

# Le site est de simples fichiers HTML/CSS/JS : aucun build n'est
# nécessaire, ce workflow ne fait que publier le dossier tel quel. Un
# changement de contenu (Sanity) n'a pas besoin de ce workflow : il
# apparaît seul, sans redéploiement (voir SANITY.md).
on:
  push:
    branches:
      - claude/zinema-cinema-redesign-ttcpaf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rassembler les fichiers du site (sans le Studio Sanity ni les scripts)
        run: |
          mkdir site
          cp -r index.html films agenda annonces histoire infos-pratiques film assets site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
