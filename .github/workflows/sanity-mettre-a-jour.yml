name: Mettre Sanity à jour

# Le contenu du site (films, tarifs, textes) vit dans Sanity, pas dans
# le code. Ce workflow permet de le lire et de le corriger depuis
# l'onglet Actions, sans rien installer sur son ordinateur.
#
# À régler UNE SEULE FOIS, dans Settings → Secrets and variables →
# Actions → New repository secret :
#
#   SANITY_WRITE_TOKEN
#
# Le jeton se crée sur https://www.sanity.io/manage → projet vle63mzm
# → API → Tokens → Add API token, avec les droits « Editor ».
# Il se révoque au même endroit, à tout moment.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        required: true
        default: voir
        options:
          - voir          # lire seulement : dit ce que le Studio contient
          - simulation    # dit ce qui changerait, sans rien écrire
          - appliquer     # écrit vraiment dans le Studio
      portee:
        description: "Sur quoi ?"
        type: choice
        required: true
        default: tout
        options:
          - tout            # films, séances, textes, remerciements
          - remerciements   # le mur des remerciements, et rien d'autre

  # Deuxième porte d'entrée, pour qui n'a pas le bouton « Run workflow »
  # (un assistant travaillant sur le dépôt, par exemple) : créer l'une
  # de ces branches déclenche le mode correspondant. Celles qui finissent
  # par « -remerciements » n'écrivent que le mur des remerciements et
  # laissent le programme du Studio intact. Elles ne servent qu'à ça et
  # peuvent être supprimées juste après.
  push:
    branches:
      - sanity/voir
      - sanity/simulation
      - sanity/appliquer
      - sanity/simulation-remerciements
      - sanity/appliquer-remerciements

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le mode et la portée viennent soit du menu « Run workflow »,
      # soit du nom de la branche qui a déclenché l'exécution.
      - name: Quel mode ?
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          PORTEE="${{ inputs.portee }}"
          if [ -z "$MODE" ]; then
            case "${{ github.ref_name }}" in
              sanity/appliquer)                MODE=appliquer ;;
              sanity/simulation)               MODE=simulation ;;
              sanity/appliquer-remerciements)  MODE=appliquer ; PORTEE=remerciements ;;
              sanity/simulation-remerciements) MODE=simulation ; PORTEE=remerciements ;;
              *)                               MODE=voir ;;
            esac
          fi
          if [ "$PORTEE" = "remerciements" ]; then
            LIMITE=--remerciements
          else
            PORTEE=tout
            LIMITE=""
          fi
          echo "valeur=$MODE" >> "$GITHUB_OUTPUT"
          echo "limite=$LIMITE" >> "$GITHUB_OUTPUT"
          echo "Mode : $MODE — portée : $PORTEE"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Le jeton Sanity est-il renseigné ?
        env:
          JETON: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::error::Le secret SANITY_WRITE_TOKEN n'existe pas encore. Le créer dans Settings → Secrets and variables → Actions, à partir d'un jeton « Editor » de https://www.sanity.io/manage (projet vle63mzm → API → Tokens)."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm ci

      - name: Ce que le Studio contient AVANT
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node sanity/import/etat.mjs

      - name: Simuler la mise à jour
        if: steps.mode.outputs.valeur == 'simulation'
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node sanity/import/mettre-a-jour.mjs ${{ steps.mode.outputs.limite }}

      - name: Appliquer la mise à jour
        if: steps.mode.outputs.valeur == 'appliquer'
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node sanity/import/mettre-a-jour.mjs --appliquer ${{ steps.mode.outputs.limite }}

      - name: Ce que le Studio contient APRÈS
        if: steps.mode.outputs.valeur == 'appliquer'
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: node sanity/import/etat.mjs
