name: Déploiement Infomaniak

# Publie le site chez Infomaniak à chaque envoi sur la branche
# principale. Rien à faire à la main : on modifie, on envoie, c'est
# en ligne.
#
# À régler UNE SEULE FOIS, dans GitHub → Settings → Secrets and
# variables → Actions → New repository secret :
#
#   INFOMANIAK_FTP_SERVEUR   ex. ftp.zinema.ch
#   INFOMANIAK_FTP_UTILISATEUR
#   INFOMANIAK_FTP_MOTDEPASSE
#
# Ces trois valeurs se trouvent dans le Manager Infomaniak, sous
# « Hébergement → FTP/SSH ». Voir DEPLOIEMENT.md.
#
# Un changement de contenu (un film ajouté dans le Studio) n'a PAS
# besoin de ce workflow : il apparaît seul, sans redéploiement.

on:
  push:
    branches:
      - claude/zinema-cinema-redesign-ttcpaf
  workflow_dispatch:

concurrency:
  group: infomaniak
  # Une publication en cours n'est jamais interrompue : la couper au
  # milieu laisserait le site à moitié mis à jour.
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On n'envoie QUE le site public. Le Studio Sanity, les modes
      # d'emploi, les dépendances et le modèle de fichier de
      # configuration n'ont rien à faire sur un serveur public.
      #
      # Le dossier « api » (billetterie SumUp) est publié depuis que
      # l'hébergement est passé en PHP 8.5. Ses clés, elles, ne
      # partent jamais d'ici : elles vivent dans un config.php posé
      # à la racine du compte, hors du dossier public, déposé une
      # fois à la main — voir BILLETTERIE.md.
      - name: Rassembler les fichiers du site
        run: |
          mkdir site
          cp -r index.html 404.html robots.txt sitemap.xml .htaccess \
                films film agenda evenements histoire membership contact billet \
                assets api site/
          echo "— contenu envoyé :"
          find site -type f | sort

      # Tant que les trois secrets ne sont pas créés, on ne tente rien :
      # une publication qui échoue à chaque envoi n'apprend rien à
      # personne. Le récapitulatif de l'action dit quoi faire.
      - name: Les identifiants FTP sont-ils renseignés ?
        id: identifiants
        env:
          SERVEUR: ${{ secrets.INFOMANIAK_FTP_SERVEUR }}
          UTILISATEUR: ${{ secrets.INFOMANIAK_FTP_UTILISATEUR }}
          MOTDEPASSE: ${{ secrets.INFOMANIAK_FTP_MOTDEPASSE }}
        run: |
          if [ -z "$SERVEUR" ] || [ -z "$UTILISATEUR" ] || [ -z "$MOTDEPASSE" ]; then
            echo "prets=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Publication ignorée : les identifiants FTP Infomaniak ne sont pas encore renseignés. Marche à suivre dans DEPLOIEMENT.md, étape 3."
          else
            echo "prets=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Envoyer chez Infomaniak (FTPS)
        if: steps.identifiants.outputs.prets == 'oui'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFOMANIAK_FTP_SERVEUR }}
          username: ${{ secrets.INFOMANIAK_FTP_UTILISATEUR }}
          password: ${{ secrets.INFOMANIAK_FTP_MOTDEPASSE }}
          protocol: ftps
          local-dir: ./site/
          # Le compte « azsa_deploy » est cloisonné : il ouvre
          # directement sur /web/nouveau, le dossier de ce site. Il ne
          # peut atteindre ni l'aiguilleur des autres cinémas, ni leurs
          # programmes. D'où « ./ » et non « web/ ».
          server-dir: ./
          # Le fichier de configuration secret (config.php) vit à côté
          # de web/, jamais dedans : il n'est donc jamais touché.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
