<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film — Zinéma</title>
<meta name="description" content="Fiche film : séances, bande-annonce et informations.">
<!-- Ce que voient WhatsApp, Facebook et Instagram quand on partage
     l'adresse. Ces réseaux ne lisent QUE le fichier HTML : ils
     n'attendent pas que le site aille chercher son contenu, donc ces
     lignes doivent rester écrites ici. Dans un vrai navigateur, elles
     sont ensuite remplacées par les textes du Studio (nav.js).
     Une seule chose à changer si le cinéma change de domaine : les
     adresses ci-dessous, et celles de robots.txt et sitemap.xml. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zinéma">
<meta property="og:locale" content="fr_CH">
<meta property="og:title" content="Film — Zinéma">
<meta property="og:description" content="Fiche film : séances, bande-annonce et informations.">
<meta property="og:image" content="https://www.zinema.ch/assets/img/zinema-logo.png">
<meta name="twitter:card" content="summary">
<!-- Pas de canonical écrit ici : toutes les fiches de films partagent
     ce fichier, chacune à son adresse /film/?s=… Un canonical figé les
     déclarerait toutes identiques, et Google n'en garderait qu'une.
     C'est nav.js qui le pose, à l'adresse réellement ouverte. -->
<link rel="icon" href="../assets/img/zinema-logo.png">
<link rel="preload" href="../assets/fonts/Aileron-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/Aileron-Black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/film-mondrian.css">
<link rel="stylesheet" href="../assets/css/achat.css">
</head>
<body data-page="film" data-root="../">
<main class="main-area">
  <div id="film-app"></div>
</main>
<div id="footer-root"></div>

<script src="../assets/js/couleurs.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/render.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/billetterie.js"></script>
<script src="../assets/js/achat.js"></script>
<script src="../assets/js/film.js"></script>
<script src="../assets/js/footer.js"></script>
</body>
</html>
